version: 2
updates:
  # Frontend npm dependencies (Storybook, Tailwind, Vite, Preline, Playwright)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "[Dependabot] npm"
    labels:
      - "npm"
      - "dependencies"
      - "update"
